server.port=8080
spring.application.name=whispermq-console
spring.main.banner-mode=off
logging.level.root=INFO
logging.level.org.guoguo=INFO

# ---------------------------------------------------------------------------
# 内嵌 Broker（页面启动后即可在 9999 上提供 MQ 服务）
# ---------------------------------------------------------------------------
whisper-mq.broker-host=127.0.0.1
whisper-mq.broker-port=9999
# 控制台使用独立数据目录，避免把仓库里历史的演示数据带进页面
whisper-mq.persist-path=./WhisperMQ-console-data
whisper-mq.offset-persist-path=./WhisperMQ-console-data/offsets

# 生产者（这个文件会覆盖 common 里的同名配置，所以必须写全）
whisper-mq.producer-timeout=4000
whisper-mq.producer-retryCountLimit=3
whisper-mq.producer-retryTimeCoefficient=500

# 持久化/刷盘
whisper-mq.flush-threshold=100
whisper-mq.max-file-size=10485760
whisper-mq.flush-interval-millis=10000
whisper-mq.window-size-millis=10000

# 演示参数：比生产默认值更短，便于在页面上快速看到重投/死信
whisper-mq.ack-timeout-millis=5000
whisper-mq.max-delivery-attempts=3
whisper-mq.max-dead-letter-retry-count=3
whisper-mq.heartbeat-interval-millis=15000
whisper-mq.reconnect-initial-delay-millis=500
whisper-mq.reconnect-max-delay-millis=5000
whisper-mq.new-group-start-from-earliest=true
whisper-mq.subscribe-timeout-millis=5000
whisper-mq.consumer-worker-threads=4
whisper-mq.consumer-queue-capacity=2000
# 分区数：1 表示与升级前一致；>1 属于 P1 Stage B 实验能力
whisper-mq.default-partitions=1

# ---------------------------------------------------------------------------
# 控制台
# ---------------------------------------------------------------------------
# “运行 Maven 测试”按钮执行的命令（在仓库根目录执行）
whisper-console.maven-command=mvn -o test
# 仓库根目录，留空则自动向上查找含 <modules> 的 pom.xml
whisper-console.repo-root=

# Stage C：热数据条数 / 保留策略（0=不清理）
whisper-mq.hot-cache-size=1000
whisper-mq.retention-millis=0
whisper-mq.retention-max-bytes=0
whisper-mq.retention-check-interval-millis=60000

# Stage D：背压 / 去重 / 鉴权（默认关闭鉴权，兼容旧客户端）
whisper-mq.backpressure-enabled=true
whisper-mq.backpressure-pause-millis=3000
whisper-mq.backpressure-resume-threshold=0.5
whisper-mq.dedup-enabled=true
whisper-mq.dedup-cache-size=1000
whisper-mq.auth-enabled=false
whisper-mq.auth-token=

# P0：刷盘与优雅停机
whisper-mq.flush-mode=ASYNC
whisper-mq.flush-interval-millis=1000
whisper-mq.shutdown-drain-millis=3000
